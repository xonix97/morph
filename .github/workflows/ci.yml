name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust formatting component
        run: rustup component add rustfmt
      - name: Run formatting check
        run: cargo fmt --check
      - name: Run canonical offline test
        run: make test
